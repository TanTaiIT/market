services:
  app:
    build: .
    ports:
      - '5000:5000'
    # CHỈ dùng cho local. Thứ tự ưu tiên của Docker là `environment` > `env_file` > `ENV` của
    # Dockerfile, nên `env_file` sẽ nuốt mất `ENV NODE_ENV=production` trong image. Deploy thật
    # phải đặt biến qua secret manager của nơi chạy, KHÔNG dùng lại file này kèm `env_file`.
    # Hai file vì config đã tách theo môi trường: `.env` giữ phần dùng chung, `.env.development`
    # giữ JWT secret + MONGO_URI của dev. Compose nạp `env_file` chứ không chạy qua
    # `src/config/env.ts`, nên phải liệt kê tay đúng cặp file của mode development.
    env_file:
      - .env
      - .env.development
    # Ghi đè host của .env (vốn trỏ localhost) sang service name của compose network.
    environment:
      # Khai báo tường minh thay vì để `.env` quyết định ngầm: `env.isDev` điều khiển việc
      # đính stack trace vào response lỗi (error.middleware.ts) và log level (logger.ts) —
      # hai thứ không được phép phụ thuộc vào một file không nằm trong git.
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/cho-tot-clone?replicaSet=rs0
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    # Replica set là điều kiện bắt buộc của transaction (đăng ký Organization ghi User +
    # Organization trong một transaction). Single-node rs0 là cấu hình nhỏ nhất chạy được.
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Tự initiate lần đầu rồi idempotent ở các lần sau. Host quảng bá là `mongo:27017`
      # nên client chạy NGOÀI compose phải nối bằng `?directConnection=true`.
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mongo-data:
