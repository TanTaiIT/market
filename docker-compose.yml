services:
  app:
    build: .
    ports:
      - '5000:5000'
    env_file: .env
    # Ghi đè host của .env (vốn trỏ localhost) sang service name của compose network.
    environment:
      MONGO_URI: mongodb://mongo:27017/cho-tot-clone
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  mongo-data:
