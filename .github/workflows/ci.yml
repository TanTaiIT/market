name: CI

# Token của workflow chỉ đọc — không job nào ở đây cần ghi vào repo (audit 7.6).
permissions:
  contents: read

# Push dồn dập lên cùng nhánh thì huỷ lượt cũ: kết quả của commit đã bị đè không ai đọc.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Suite ~6 phút; treo (mongodb-memory-server không tải được binary) thì đừng giữ runner cả giờ.
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # mongodb-memory-server tải binary ~100MB mỗi lượt chạy sạch — cache theo OS.
      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Install dependencies
        run: npm ci

      # Chỉ chặn lỗ hổng cao/nghiêm trọng ở dependency RUNTIME — moderate và devDependencies thì
      # báo ở log, không chặn merge (audit 7.1).
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      # lint:check / format:check, KHÔNG dùng `npm run lint` — lệnh đó chạy --fix + --write
      # nên CI sẽ tự sửa file và không bao giờ fail vì lint/format.
      - name: Lint
        run: npm run lint:check

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # Spec đã commit phải khớp code: client codegen từ `openapi.json`, lệch là app gọi sai.
      - name: OpenAPI drift
        run: npm run openapi:export && git diff --exit-code -- openapi.json
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/ci
          JWT_SECRET: ci-only-jwt-secret-not-for-production-0123456789
          JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production-9876543210

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
